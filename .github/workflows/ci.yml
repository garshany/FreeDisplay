name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: macos-15-arm64
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.3 (Swift 6.2)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          swift --version
      - uses: actions/cache@v4
        with:
          path: |
            .spm
            .dd/SourcePackages
          key: ${{ runner.os }}-${{ runner.arch }}-xcode26.3-spm-${{ hashFiles('Package.swift', 'project.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode26.3-spm-
      - name: Build and test core
        run: |
          swift build --scratch-path ./.spm
          swift test --scratch-path ./.spm
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml
      - name: Build macOS schemes without signing
        run: |
          set -euo pipefail
          for scheme in OpenDisplay OpenDisplay-PublicAPIOnly opendisplay OpenDisplayRescue; do
            xcodebuild -project OpenDisplay.xcodeproj -scheme "$scheme" -configuration Debug \
              -derivedDataPath ./.dd CODE_SIGNING_ALLOWED=NO build
          done
      - name: Synthetic loopback integration
        run: Tests/Integration/run-local-control-loopback.sh
      - name: Offline release tooling tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
